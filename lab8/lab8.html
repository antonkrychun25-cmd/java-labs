<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №8 — Кричун Антон</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
        }
        .block {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
        button {
            padding: 8px 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0052a3;
        }
        #t1_box {
            width: 50px;
            height: 50px;
            background-color: #0066cc;
            position: relative;
            margin-top: 10px;
            border-radius: 4px;
        }
        #logo_container {
            width: 100%;
            height: 300px;
            background-color: #0f172a;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #logo_badge {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            position: absolute;
            z-index: 2;
        }
        #logo_text {
            position: absolute;
            bottom: 30px;
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 2;
            font-family: monospace;
        }
        .particle {
            position: absolute;
            background-color: #38bdf8;
            border-radius: 50%;
            opacity: 0.7;
            z-index: 1;
        }
    </style>
</head>
<body>

    <p><a href="../index.html">← На головну сторінку</a></p>

    <h1>Лабораторна робота №8</h1>
    <p>Студент: Кричун Антон Дмитрович | Варіант: 13</p>
    <hr>

    <div class="block">
        <h3>Завдання 1. Приклад базової JS-анімації</h3>
        <button onclick="startTask1()">Запустити анімацію</button>
        <div id="t1_box"></div>
    </div>

    <div class="block">
        <h3>Завдання 2. Анімований логотип "Інженерія програмного забезпечення"</h3>
        <button id="logo_btn" onclick="toggleLogoAnimation()">Запустити логотип</button>
        <div id="logo_container">
            <div id="logo_badge">&lt;/&gt;</div>
            <div id="logo_text"></div>
        </div>
    </div>

    <script>
        let t1Timer = null;
        function startTask1() {
            let box = document.getElementById("t1_box");
            let pos = 0;
            clearInterval(t1Timer);
            t1Timer = setInterval(() => {
                if (pos >= 200) {
                    clearInterval(t1Timer);
                } else {
                    pos += 2;
                    box.style.left = pos + "px";
                    box.style.backgroundColor = `rgb(${pos}, 100, 204)`;
                }
            }, 10);
        }

        let isRunning = false;
        let animTimer = null;
        let angle = 0;
        let scale = 1;
        let scaleDir = 0.01;
        
        let fullText = "Інженерія програмного забезпечення";
        let charIndex = 0;
        let isDeleting = false;
        let textTimer = 0;

        function toggleLogoAnimation() {
            let btn = document.getElementById("logo_btn");
            if (!isRunning) {
                isRunning = true;
                btn.innerText = "Зупинити логотип";
                animTimer = setInterval(updateLogo, 20);
            } else {
                isRunning = false;
                btn.innerText = "Запустити логотип";
                clearInterval(animTimer);
            }
        }

        function updateLogo() {
            let badge = document.getElementById("logo_badge");
            let container = document.getElementById("logo_container");

            angle += 0.05;
            let x = Math.cos(angle) * 40;
            let y = Math.sin(angle) * 20;

            scale += scaleDir;
            if (scale > 1.2 || scale < 0.8) scaleDir = -scaleDir;

            badge.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            badge.style.opacity = scale;

            textTimer++;
            if (textTimer % 5 === 0) {
                let textElem = document.getElementById("logo_text");
                if (!isDeleting) {
                    textElem.innerText = fullText.substring(0, charIndex + 1);
                    charIndex++;
                    if (charIndex === fullText.length) {
                        isDeleting = true;
                        textTimer = -20;
                    }
                } else {
                    textElem.innerText = fullText.substring(0, charIndex - 1);
                    charIndex--;
                    if (charIndex === 0) {
                        isDeleting = false;
                    }
                }
            }

            if (Math.random() < 0.1) {
                let p = document.createElement("div");
                p.className = "particle";
                let size = Math.random() * 8 + 4;
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.left = Math.random() * container.clientWidth + "px";
                p.style.top = container.clientHeight + "px";
                container.appendChild(p);

                let pY = container.clientHeight;
                let pTimer = setInterval(() => {
                    pY -= 2;
                    p.style.top = pY + "px";
                    if (pY < -10 || !isRunning) {
                        clearInterval(pTimer);
                        p.remove();
                    }
                }, 30);
            }
        }
    </script>
</body>
</html>
